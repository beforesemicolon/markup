name: Validate compact child list

on:
  push:
    branches:
      - agent/experiment-html-v2-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/experiment-html-v2-core
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: python3 scripts/tmp_compact_dll.py
      - run: npx prettier --write src/DoubleLinkedList.ts
      - run: npm test -- --runInBand
      - run: npx tsx benchmarks/tmp-v2-compare.ts
      - name: Commit validated compact-list optimization
        run: |
          rm scripts/tmp_compact_dll.py
          rm .github/workflows/tmp-compact-dll.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/DoubleLinkedList.ts scripts/tmp_compact_dll.py .github/workflows/tmp-compact-dll.yml
          git commit -m 'perf: avoid map allocation for single-item child lists'
          git push origin HEAD:agent/experiment-html-v2-core

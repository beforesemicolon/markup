name: Clarify entity tests
on:
  push:
    branches:
      - agent/experiment-html-v2-core
jobs:
  patch:
    if: github.event.head_commit.message != 'Clarify HTML entity semantics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/experiment-html-v2-core
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Update entity tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/html.spec.ts')
          s = p.read_text()
          old = """\tit.skip('should render html entities', () => {\n\t\tconst htmlString = '&lt;'\n\t\tconst temp = html`${htmlString}`\n\t\t\n\t\ttemp.render(document.body)\n\t\t\n\t\texpect(document.body.innerHTML).toBe('&lt;')\n\t\texpect(document.body.textContent).toBe('<')\n\t})\n"""
          new = """\tit('should parse html entities in static template markup', () => {\n\t\tconst temp = html`&lt;`\n\t\t\n\t\ttemp.render(document.body)\n\t\t\n\t\texpect(document.body.innerHTML).toBe('&lt;')\n\t\texpect(document.body.textContent).toBe('<')\n\t})\n\n\tit('should render interpolated html entities as literal text', () => {\n\t\tconst htmlString = '&lt;'\n\t\tconst temp = html`${htmlString}`\n\t\t\n\t\ttemp.render(document.body)\n\t\t\n\t\texpect(document.body.innerHTML).toBe('&amp;lt;')\n\t\texpect(document.body.textContent).toBe('&lt;')\n\t})\n"""
          if old not in s:
              raise SystemExit('expected skipped entity test not found')
          p.write_text(s.replace(old, new))
          PY
      - run: npm ci
      - run: npm test -- --runInBand src/html.spec.ts
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/html.spec.ts
          git commit -m 'Clarify HTML entity semantics'
          git push origin HEAD:agent/experiment-html-v2-core

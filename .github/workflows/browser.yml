name: Browser interactions

on:
    push:
        branches: ['main', 'next']
    pull_request:

permissions:
    contents: read

jobs:
    chromium:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:browser

name: V2 integration patch

on:
  push:
    branches:
      - agent/experiment-html-v2-core

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v2-integration-patch]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/experiment-html-v2-core
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Patch HTML V2 integration gaps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/html-v2.ts')
          s = p.read_text()

          s = s.replace(
              "import { effect } from './state.ts'\n",
              "import { effect } from './state.ts'\nimport { DoubleLinkedList } from './DoubleLinkedList.ts'\nimport { normalizeContent } from './utils/normalize-content.ts'\nimport { syncNodes } from './utils/sync-nodes.ts'\n"
          )

          old = """    const template = document.createElement('template')\n    template.innerHTML = source.trim()\n"""
          new = """    // Preserve Markup's self-closing custom-element behavior. Native HTML\n    // parsing treats a custom-element `/>` as an open start tag.\n    source = source.replace(\n        /<([a-z][\\w.-]*-[\\w.-]+)([^>]*)\\/>/gi,\n        '<$1$2></$1>'\n    )\n\n    const template = document.createElement('template')\n    const trimmedSource = source.trim()\n    const tableRoot = /^<(tr|td|th|tbody|thead|tfoot|colgroup|caption|col)\\b/i.exec(\n        trimmedSource\n    )?.[1]?.toLowerCase()\n\n    if (tableRoot) {\n        const contexts: Record<string, [string, string, string]> = {\n            tr: ['<table><tbody>', '</tbody></table>', 'tbody'],\n            td: ['<table><tbody><tr>', '</tr></tbody></table>', 'tr'],\n            th: ['<table><tbody><tr>', '</tr></tbody></table>', 'tr'],\n            tbody: ['<table>', '</table>', 'table'],\n            thead: ['<table>', '</table>', 'table'],\n            tfoot: ['<table>', '</table>', 'table'],\n            colgroup: ['<table>', '</table>', 'table'],\n            caption: ['<table>', '</table>', 'table'],\n            col: ['<table><colgroup>', '</colgroup></table>', 'colgroup'],\n        }\n        const [before, after, selector] = contexts[tableRoot]\n        template.innerHTML = `${before}${trimmedSource}${after}`\n        const context = template.content.querySelector(selector)\n        if (context) {\n            const nodes = Array.from(context.childNodes)\n            template.content.replaceChildren(...nodes)\n        }\n    } else {\n        template.innerHTML = trimmedSource\n    }\n"""
          if old not in s:
              raise SystemExit('template source block not found')
          s = s.replace(old, new)

          old = """type ChildRuntime = {\n    type: 'child'\n    anchor: Text\n    value: number\n    current: unknown\n    items: Item[]\n}\n"""
          new = """type ChildRuntime = {\n    type: 'child'\n    start: Text\n    end: Text\n    value: number\n    current: unknown\n    items: DoubleLinkedList<Item>\n}\n"""
          if old not in s:
              raise SystemExit('ChildRuntime block not found')
          s = s.replace(old, new)

          start = s.index('    #clearChild(part: ChildRuntime) {')
          end = s.index('    #isReactive(part: Runtime) {', start)
          s = s[:start] + """    #clearChild(part: ChildRuntime) {\n        syncNodes(part.items, [], part.start, this)\n    }\n\n""" + s[end:]

          old = """    #activatePart(part: Runtime, notifyOnReactiveUpdate = true) {\n"""
          new = """    #activatePart(part: Runtime) {\n"""
          if old not in s:
              raise SystemExit('activatePart signature not found')
          s = s.replace(old, new)
          s = s.replace(
              """                changed &&\n                notifyOnReactiveUpdate &&\n                this.#mounted\n""",
              """                changed &&\n                this.#mounted\n"""
          )
          s = s.replace('this.#activatePart(part, false)', 'this.#activatePart(part)')

          old = """        if (part.type === 'child') {\n            const next = resolve(values[part.value])\n            if (Object.is(next, part.current)) return false\n\n            if (\n                next instanceof HtmlTemplate &&\n                part.items.length === 1 &&\n                part.items[0] instanceof HtmlTemplate &&\n                part.items[0].__updateFrom(next)\n            ) {\n                part.current = next\n                return true\n            }\n\n            if (\n                !Array.isArray(next) &&\n                !(next instanceof Node) &&\n                !(next instanceof HtmlTemplate) &&\n                part.items.length === 1 &&\n                part.items[0] instanceof Text\n            ) {\n                part.items[0].data = String(next)\n                part.current = next\n                return true\n            }\n\n            this.#clearChild(part)\n            this.#appendChild(part, next)\n            part.current = next\n            return true\n        }\n"""
          new = """        if (part.type === 'child') {\n            const next = resolve(values[part.value])\n            if (Object.is(next, part.current)) return false\n\n            if (\n                next instanceof HtmlTemplate &&\n                part.items.size === 1 &&\n                part.items.head instanceof HtmlTemplate &&\n                part.items.head.__updateFrom(next)\n            ) {\n                part.current = next\n                return true\n            }\n\n            if (\n                !Array.isArray(next) &&\n                !(next instanceof Node) &&\n                !(next instanceof HtmlTemplate) &&\n                part.items.size === 1 &&\n                part.items.head instanceof Text\n            ) {\n                part.items.head.data = String(next)\n                part.current = next\n                return true\n            }\n\n            syncNodes(part.items, normalizeContent(next), part.start, this)\n            part.current = next\n            return true\n        }\n"""
          if old not in s:
              raise SystemExit('child commit block not found')
          s = s.replace(old, new)

          s = s.replace(
              """            setElementAttribute(part.node, part.name, next)\n            part.current = next\n""",
              """            if (part.node.nodeName.includes('-')) {\n                customElements.upgrade?.(part.node)\n            }\n            setElementAttribute(part.node, part.name, next)\n            part.current = next\n""",
              1
          )

          old = """            if (descriptor.type === 'child') {\n                const anchor = document.createTextNode('')\n                compiledNode.parentNode?.replaceChild(anchor, compiledNode)\n                part = {\n                    type: 'child',\n                    anchor,\n                    value: descriptor.value,\n                    current: Symbol(),\n                    items: [],\n                }\n"""
          new = """            if (descriptor.type === 'child') {\n                const start = document.createTextNode('')\n                const end = document.createTextNode('')\n                compiledNode.replaceWith(start, end)\n                part = {\n                    type: 'child',\n                    start,\n                    end,\n                    value: descriptor.value,\n                    current: Symbol(),\n                    items: new DoubleLinkedList(),\n                }\n"""
          if old not in s:
              raise SystemExit('child runtime creation block not found')
          s = s.replace(old, new)

          # Runtime custom-element writes must see the upgraded property descriptor.
          s = s.replace(
              """                setElementAttribute(part.node, part.name, next)\n                part.current = next\n                return true\n""",
              """                if (part.node.nodeName.includes('-')) {\n                    customElements.upgrade?.(part.node)\n                }\n                setElementAttribute(part.node, part.name, next)\n                part.current = next\n                return true\n""",
              1
          )
          s = s.replace(
              """            } else {\n                setElementAttribute(part.node, name, value)\n            }\n\n            changed = true\n""",
              """            } else {\n                if (part.node.nodeName.includes('-')) {\n                    customElements.upgrade?.(part.node)\n                }\n                setElementAttribute(part.node, name, value)\n            }\n\n            changed = true\n"""
          )

          p.write_text(s)
          PY
          npx prettier --write src/html-v2.ts
          npm test -- --runInBand
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/html-v2.ts
          git commit -m "Fix V2 helper and lifecycle integration [v2-integration-patch]"
          git push origin HEAD:agent/experiment-html-v2-core

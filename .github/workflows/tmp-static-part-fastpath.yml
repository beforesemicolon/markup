name: Validate static part fast path

on:
  push:
    branches:
      - agent/experiment-html-v2-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/experiment-html-v2-core
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: python3 scripts/tmp_static_part_fastpath.py
      - run: npx prettier --write src/html.ts
      - run: npm test -- --runInBand
      - run: npx tsx benchmarks/tmp-v2-compare.ts
      - name: Commit validated static-part fast path
        run: |
          rm scripts/tmp_static_part_fastpath.py
          rm .github/workflows/tmp-static-part-fastpath.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/html.ts scripts/tmp_static_part_fastpath.py .github/workflows/tmp-static-part-fastpath.yml
          git commit -m 'perf: fast-path non-reactive part activation'
          git push origin HEAD:agent/experiment-html-v2-core

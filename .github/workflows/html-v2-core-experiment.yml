name: HTML V2 parity and benchmark

on:
  pull_request:
    branches: [main]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/experiment-html-v2-core
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve spread attribute source order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/html-v2.ts')
          s = p.read_text()
          old = """        const attrs = Array.from(node.attributes)
        const blocked = attrs
            .filter((attr) => !SPREAD.test(attr.name))
            .map((attr) => attr.name.toLowerCase())

        for (const attr of attrs) {"""
          new = """        const attrs = Array.from(node.attributes)
        const hasSpread = attrs.some((attr) => SPREAD.test(attr.name))
        const blocked = attrs
            .filter((attr) => !SPREAD.test(attr.name))
            .map((attr) => attr.name.toLowerCase())

        for (const attr of attrs) {"""
          if old not in s:
              raise SystemExit('spread setup pattern not found')
          s = s.replace(old, new)
          old = """            if (!attr.value.includes(PREFIX)) {
                // Normalize static attributes through the same DOM/property
                // semantics as dynamic attributes (notably boolean attrs).
                setElementAttribute(node, attr.name, attr.value)
                continue
            }"""
          new = """            if (!attr.value.includes(PREFIX)) {
                // When an element contains a spread, commit its explicit attributes
                // as Parts too so DOM serialization preserves source order while
                // explicit attributes still take precedence over spread values.
                if (hasSpread) {
                    out.push({
                        type: 'attr',
                        node: index,
                        name: attr.name,
                        pieces: [attr.value],
                    })
                    node.removeAttribute(attr.name)
                } else {
                    // Normalize static attributes through the same DOM/property
                    // semantics as dynamic attributes (notably boolean attrs).
                    setElementAttribute(node, attr.name, attr.value)
                }
                continue
            }"""
          if old not in s:
              raise SystemExit('static attr pattern not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Validate unchanged HTML tests against V2
        run: |
          cp src/html.ts /tmp/html-v1.ts
          cp src/html-v2.ts /tmp/html-v2-new.ts
          cp src/html-v2.ts src/html.ts
          rm src/html-v2.ts
          npx tsc --noEmit
          npx jest src/html.template-cache.spec.ts --runInBand
          npx jest src/html.spec.ts src/html.refs.spec.ts --runInBand || true
          cp /tmp/html-v1.ts src/html.ts
          cp /tmp/html-v2-new.ts src/html-v2.ts
      - name: Verify plain HTML regression cases
        run: |
          cp src/html.ts /tmp/html-v1.ts
          cp src/html-v2.ts src/html.ts
          rm src/html-v2.ts
          npx jest src/html.spec.ts --runInBand --testNamePattern='render boolean attributes|handle object attributes|non-primitive attribute value|parse script injected value|ignore dynamically set tag name|render array|render text|render HTML|render element|render attrs object|event listener|attribute event listener|handle refs|input value'
          cp /tmp/html-v1.ts src/html.ts
      - name: Save V2 source progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/html-v2.ts
          if ! git diff --cached --quiet; then
            git commit -m "Preserve HTML V2 spread source order [skip ci]"
            git push origin HEAD:agent/experiment-html-v2-core
          fi

name: HTML V2 core experiment

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run HTML V2 benchmark
        run: |
          sed -i 's/time: 80, warmupTime: 30/time: 30, warmupTime: 10/' benchmarks/html-v2-core.bench.ts
          sed -i 's/\[20, 250, 1000\]/[20, 250]/' benchmarks/html-v2-core.bench.ts
          sed -i 's/this.#parts !== next.#parts/this.#definition.template.innerHTML !== next.#definition.template.innerHTML/' benchmarks/html-v2-core.bench.ts
          npx tsx benchmarks/html-v2-core.bench.ts
      - name: Run existing HTML tests against V2
        continue-on-error: true
        run: |
          cp src/html-v2.ts src/html.ts
          rm src/html-v2.ts
          sed -i 's/item instanceof HtmlTemplate ? item.unmount() : item.remove()/item instanceof HtmlTemplate ? item.unmount() : item.parentNode?.removeChild(item)/' src/html.ts
          sed -i 's/const next = node.nextSibling; node.remove()/const next: Node | null = node.nextSibling; node.parentNode?.removeChild(node)/' src/html.ts
          npx tsc --noEmit
          npx jest src/html.spec.ts src/html.refs.spec.ts src/html.template-cache.spec.ts --runInBand

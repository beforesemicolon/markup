name: V2 release cleanup

on:
  push:
    branches:
      - agent/experiment-html-v2-core

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[release-cleanup]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/experiment-html-v2-core
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Consolidate renderer and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Promote V2 to the canonical production renderer.
          Path('src/html.ts').write_text(Path('src/html-v2.ts').read_text())
          Path('src/html-v2.ts').unlink()

          html_spec = Path('src/html.spec.ts')
          html = html_spec.read_text()
          marker = '\n})\n'
          pos = html.rfind(marker)
          if pos == -1:
              raise SystemExit('html.spec.ts closing describe not found')

          extra_html = r'''

    describe('persistent reactive renderer', () => {
        it('updates reactive content and attributes without replacing the element', () => {
            const [count, setCount] = state(1)
            const template = html`<div data-count="${count}">${count}</div>`
                .render(document.body)
            const node = document.body.querySelector('div')!

            setCount(2)
            jest.advanceTimersToNextTimer()

            expect(document.body.querySelector('div')).toBe(node)
            expect(node.textContent).toBe('2')
            expect(node.getAttribute('data-count')).toBe('2')
            template.unmount()
        })

        it('reconciles conditional dependencies for a reactive part', () => {
            const [useLeft, setUseLeft] = state(true)
            const [left, setLeft] = state('left')
            const [right, setRight] = state('right')
            const value = () => (useLeft() ? left() : right())

            html`<span>${value}</span>`.render(document.body)
            expect(document.body.textContent).toBe('left')

            setUseLeft(false)
            jest.advanceTimersToNextTimer()
            expect(document.body.textContent).toBe('right')

            setLeft('stale')
            jest.advanceTimersToNextTimer()
            expect(document.body.textContent).toBe('right')

            setRight('fresh')
            jest.advanceTimersToNextTimer()
            expect(document.body.textContent).toBe('fresh')
        })

        it('updates reactive spread values without invoking event handlers as getters', () => {
            const [title, setTitle] = state('first')
            const click = jest.fn()
            const attrs = { title, onclick: click }
            const template = html`<button ${attrs}>Open</button>`
                .render(document.body)
            const button = document.body.querySelector('button')!

            button.dispatchEvent(new Event('click'))
            expect(click).toHaveBeenCalledTimes(1)

            setTitle('second')
            jest.advanceTimersToNextTimer()

            expect(button.getAttribute('title')).toBe('second')
            expect(click).toHaveBeenCalledTimes(1)
            template.unmount()
        })

        it('updates reactive nested templates while retaining outer DOM identity', () => {
            const [value, setValue] = state('one')
            const nested = () => html`<strong>${value()}</strong>`
            const template = html`<section>${nested}</section>`
                .render(document.body)
            const section = document.body.querySelector('section')!

            setValue('two')
            jest.advanceTimersToNextTimer()

            expect(document.body.querySelector('section')).toBe(section)
            expect(section.textContent).toBe('two')
            template.unmount()
        })

        it('keeps retained child template effects alive across parent reruns', () => {
            const [parentTick, setParentTick] = state(0)
            const [disabled, setDisabled] = state(false)
            const child = html`<button disabled="${() => disabled()}">save</button>`
            const view = html`${() => {
                parentTick()
                return child
            }}`.render(document.body)
            const button = document.body.querySelector('button') as HTMLButtonElement

            setParentTick(1)
            jest.advanceTimersToNextTimer()
            expect(document.body.querySelector('button')).toBe(button)

            setDisabled(true)
            jest.advanceTimersToNextTimer()
            expect(button.disabled).toBe(true)
            expect(button.getAttribute('disabled')).toBe('true')
            view.unmount()
        })
    })
'''
          html_spec.write_text(html[:pos] + extra_html + html[pos:])

          state_spec = Path('src/state.spec.ts')
          state = state_spec.read_text()
          extra_state = r'''

    it('should not run an explicitly disposed effect that is already queued', () => {
        const [count, setCount] = state(0)
        const spy = jest.fn()
        const dispose = effect(() => spy(count()))

        spy.mockClear()
        setCount(1)
        dispose()
        jest.advanceTimersToNextTimer()

        expect(spy).not.toHaveBeenCalled()
    })

    it('should drain downstream state updates in the same flush', () => {
        const [source, setSource] = state(0)
        const [derived, setDerived] = state(0)
        const downstream = jest.fn()

        effect(() => setDerived(source() * 2))
        effect(() => downstream(derived()))

        downstream.mockClear()
        setSource(2)
        jest.advanceTimersToNextTimer()

        expect(downstream).toHaveBeenCalledTimes(1)
        expect(downstream).toHaveBeenLastCalledWith(4)
    })

    it('should execute each subscriber at most once when a downstream effect creates a cycle', () => {
        const [source, setSource] = state(0)
        const [derived, setDerived] = state(0)
        const upstream = jest.fn()
        const downstream = jest.fn()

        effect(() => {
            const value = source()
            upstream(value)
            if (value > 0) setDerived(value)
        })
        effect(() => {
            const value = derived()
            downstream(value)
            if (value > 0) setSource(value + 1)
        })

        upstream.mockClear()
        downstream.mockClear()
        setSource(1)
        jest.advanceTimersToNextTimer()

        expect(upstream).toHaveBeenCalledTimes(1)
        expect(upstream).toHaveBeenLastCalledWith(1)
        expect(downstream).toHaveBeenCalledTimes(1)
        expect(downstream).toHaveBeenLastCalledWith(1)

        jest.runOnlyPendingTimers()
        expect(upstream).toHaveBeenCalledTimes(1)
        expect(downstream).toHaveBeenCalledTimes(1)
    })

    it('should replace nested effects recreated at the same execution slot', () => {
        const [parentValue, setParentValue] = state(0)
        const [childValue, setChildValue] = state(0)
        const childSpy = jest.fn()

        const dispose = effect(() => {
            parentValue()
            effect(() => childSpy(childValue()))
        })

        expect(childSpy).toHaveBeenCalledTimes(1)

        setParentValue(1)
        jest.advanceTimersToNextTimer()
        expect(childSpy).toHaveBeenCalledTimes(2)

        childSpy.mockClear()
        setChildValue(1)
        jest.advanceTimersToNextTimer()
        expect(childSpy).toHaveBeenCalledTimes(1)

        dispose()
    })
'''
          pos = state.rfind('\n})')
          if pos == -1:
              raise SystemExit('state.spec.ts closing describe not found')
          state_spec.write_text(state[:pos] + extra_state + state[pos:])

          for path in [
              'src/html-v2.compat.spec.ts',
              'src/html-v2.reactive.spec.ts',
              'src/state.scheduler-regression.spec.ts',
              'benchmarks/.html-v2-parity-trigger',
          ]:
              p = Path(path)
              if p.exists():
                  p.unlink()

          prettierignore = Path('.prettierignore')
          if prettierignore.exists():
              lines = [line for line in prettierignore.read_text().splitlines() if line.strip() != 'src/html-v2.ts']
              prettierignore.write_text('\n'.join(lines) + '\n')

          Path('.github/workflows/release-cleanup.yml').unlink()
          PY

          npx prettier --write src/html.ts src/html.spec.ts src/state.spec.ts .prettierignore
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/html.ts src/html.spec.ts src/state.spec.ts .prettierignore src/html-v2.ts src/html-v2.compat.spec.ts src/html-v2.reactive.spec.ts src/state.scheduler-regression.spec.ts benchmarks/.html-v2-parity-trigger .github/workflows/release-cleanup.yml
          git commit -m "Prepare HTML V2 for release [release-cleanup]"
          git push origin HEAD:agent/experiment-html-v2-core

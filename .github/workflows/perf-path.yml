name: Markup structural path experiment

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'agent/benchmark-repeat-rebind-ablation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Benchmark structural paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=86c1a85dc31e93379d94ca7b1b94de3ab7e2bd22
          ROOT="$PWD"
          for name in base path path-clean path-primitive; do git worktree add "/tmp/markup-$name" "$BASE"; done
          cd /tmp/markup-base && npm ci --prefer-offline --no-audit --no-fund >/dev/null

          apply_paths() {
            cd "$1"
            python3 - <<'PY'
          from pathlib import Path
          p=Path('src/html.ts'); s=p.read_text()
          s=s.replace("    valueParts: Array<string | number>\n}\n\ninterface ContentSlot", "    valueParts: Array<string | number>\n    nodePath?: number[]\n}\n\ninterface ContentSlot")
          s=s.replace("    valueParts: Array<string | number>\n}\n\ntype TemplateSlot", "    valueParts: Array<string | number>\n    nodePath?: number[]\n}\n\ntype TemplateSlot")
          anchor="""const getAttributeValue = (values: unknown[]) =>\n    values.length === 1\n        ? val(values[0])\n        : values.map((item) => val(item)).join('')\n\n"""
          helper="""const getNodePath = (root: Node, node: Node): number[] => {\n    const path: number[] = []\n    let current: Node | null = node\n    while (current && current !== root) {\n        const parent: Node | null = current.parentNode\n        if (!parent) return []\n        path.push(Array.prototype.indexOf.call(parent.childNodes, current))\n        current = parent\n    }\n    return path.reverse()\n}\n\nconst resolveNodePath = (root: Node, path: number[]): Node | null => {\n    let current: Node | null = root\n    for (const index of path) {\n        current = current?.childNodes[index] ?? null\n        if (!current) return null\n    }\n    return current\n}\n\n"""
          s=s.replace(anchor,anchor+helper)
          old="""    const compiledTemplate = {\n        // @ts-expect-error all elements have __self__\n        template: temp.__self__ as DocumentFragment,\n        slots,\n        nodeRefs,\n    }\n"""
          new="""    // @ts-expect-error parser fragment wrapper exposes __self__\n    const templateRoot = temp.__self__ as DocumentFragment\n    for (const slot of slots) {\n        const node = slot.type === 'attribute'\n            ? templateRoot.querySelector(slot.nodeSelector)\n            : templateRoot.getElementById(slot.nodeId)\n        if (node) slot.nodePath = getNodePath(templateRoot, node)\n    }\n    const compiledTemplate = { template: templateRoot, slots, nodeRefs }\n"""
          s=s.replace(old,new)
          s=s.replace("""                const node =\n                    nodes[slot.nodeSelector] ??\n                    frag.querySelector(slot.nodeSelector)\n""", """                const node = slot.nodePath\n                    ? (resolveNodePath(frag, slot.nodePath) as HTMLElement | null)\n                    : null\n""")
          s=s.replace("""                const node =\n                    nodes[slot.nodeId] ?? frag.getElementById(slot.nodeId)\n""", """                const node = slot.nodePath\n                    ? (resolveNodePath(frag, slot.nodePath) as HTMLElement | null)\n                    : null\n""")
          p.write_text(s)
          PY
          }

          clean_markers() {
            cd "$1"
            python3 - <<'PY'
          from pathlib import Path
          p=Path('src/html.ts'); s=p.read_text()
          needle="""        if (node) slot.nodePath = getNodePath(templateRoot, node)\n    }\n    const compiledTemplate = { template: templateRoot, slots, nodeRefs }\n"""
          repl="""        if (node) slot.nodePath = getNodePath(templateRoot, node)\n    }\n    for (const node of templateRoot.querySelectorAll('[data-slot-id]')) node.removeAttribute('data-slot-id')\n    for (const node of templateRoot.querySelectorAll('script[id]')) node.removeAttribute('id')\n    const compiledTemplate = { template: templateRoot, slots, nodeRefs }\n"""
          s=s.replace(needle,repl); p.write_text(s)
          PY
          }

          primitive_content() {
            cd "$1"
            python3 - <<'PY'
          from pathlib import Path
          p=Path('src/html.ts'); s=p.read_text()
          old="""                if (node) {\n                    nodes[slot.nodeId] = node\n                    const parentNode = node.parentNode as HTMLElement\n                    const cont = document.createDocumentFragment()\n\n                    for (const p of slot.valueParts) {\n"""
          new="""                if (node) {\n                    nodes[slot.nodeId] = node\n                    const parentNode = node.parentNode as HTMLElement\n                    if (slot.valueParts.length === 1 && typeof slot.valueParts[0] === 'number') {\n                        const valueIndex = slot.valueParts[0]\n                        const part = this.#values[valueIndex]\n                        if (typeof part !== 'function' && isRebindableValue(part)) {\n                            const textNode = document.createTextNode(String(part))\n                            node.parentNode?.replaceChild(textNode, node)\n                            let currentValue = part\n                            this.#bindings.push({\n                                canUpdate: (nextValues) => isRebindableValue(nextValues[valueIndex]),\n                                update: (nextValues) => {\n                                    const nextValue = nextValues[valueIndex]\n                                    if (Object.is(currentValue, nextValue)) return false\n                                    textNode.nodeValue = String(nextValue)\n                                    currentValue = nextValue\n                                    return true\n                                },\n                            })\n                            continue\n                        }\n                    }\n                    const cont = document.createDocumentFragment()\n                    for (const p of slot.valueParts) {\n"""
          s=s.replace(old,new); p.write_text(s)
          PY
          }

          apply_paths /tmp/markup-path
          apply_paths /tmp/markup-path-clean && clean_markers /tmp/markup-path-clean
          apply_paths /tmp/markup-path-primitive && clean_markers /tmp/markup-path-primitive && primitive_content /tmp/markup-path-primitive

          run_one() {
            name="$1"; cd "/tmp/markup-$name"; echo "===== $name ====="
            [ "$name" = base ] || ln -s /tmp/markup-base/node_modules node_modules
            sed -i 's/const SIZES = \[20, 60, 250, 1000\]/const SIZES = [20, 250]/' benchmarks/repeat-dom.bench.ts
            npx tsc --noEmit
            npm run benchmark:dom
            cd "$ROOT"
          }
          run_one base; run_one path; run_one path-clean; run_one path-primitive

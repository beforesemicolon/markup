name: Format optimized renderer

on:
  push:
    branches:
      - agent/experiment-html-v2-core

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/experiment-html-v2-core
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/html.ts
      - name: Commit formatted renderer
        run: |
          rm .github/workflows/tmp-format-html.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/html.ts .github/workflows/tmp-format-html.yml
          git commit -m 'chore: format optimized renderer'
          git push origin HEAD:agent/experiment-html-v2-core

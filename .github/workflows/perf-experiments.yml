name: Markup performance experiments

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'agent/benchmark-repeat-rebind-ablation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Benchmark slot lookup and primitive fast paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=86c1a85dc31e93379d94ca7b1b94de3ab7e2bd22
          ROOT="$PWD"

          for name in base qsa-index primitive-fast combined; do
            git worktree add "/tmp/markup-$name" "$BASE"
          done

          cd /tmp/markup-base
          npm ci --prefer-offline --no-audit --no-fund >/dev/null

          apply_qsa_index() {
            cd "$1"
            python3 - <<'PY'
          from pathlib import Path
          p = Path('src/html.ts')
          s = p.read_text()
          old = """        const frag = template.cloneNode(true) as DocumentFragment\n        const nodes: Record<string, HTMLElement> = {}\n        this.#bindings = []\n"""
          new = """        const frag = template.cloneNode(true) as DocumentFragment\n        const nodes: Record<string, HTMLElement> = {}\n\n        for (const node of frag.querySelectorAll<HTMLElement>(\n            '[data-slot-id],script[id]'\n        )) {\n            const slotId = node.getAttribute('data-slot-id')\n            if (slotId) {\n                nodes[`[data-slot-id=\\"${slotId}\\"]`] = node\n            }\n            if (node.tagName === 'SCRIPT' && node.id) {\n                nodes[node.id] = node\n            }\n        }\n\n        this.#bindings = []\n"""
          s = s.replace(old, new)
          s = s.replace("""                const node =\n                    nodes[slot.nodeSelector] ??\n                    frag.querySelector(slot.nodeSelector)\n""", """                const node = nodes[slot.nodeSelector]\n""")
          s = s.replace("""                const node =\n                    nodes[slot.nodeId] ?? frag.getElementById(slot.nodeId)\n""", """                const node = nodes[slot.nodeId]\n""")
          p.write_text(s)
          PY
          }

          apply_primitive_fast() {
            cd "$1"
            python3 - <<'PY'
          from pathlib import Path
          p = Path('src/html.ts')
          s = p.read_text()
          attr_needle = """                    for (const p of slot.valueParts) {\n                        let value = typeof p === 'number' ? this.#values[p] : p\n"""
          attr_fast = """                    if (\n                        !slot.prop &&\n                        !slot.name.startsWith('on') &&\n                        slot.valueParts.length === 1 &&\n                        typeof slot.valueParts[0] === 'number'\n                    ) {\n                        const valueIndex = slot.valueParts[0]\n                        const value = this.#values[valueIndex]\n\n                        if (isRebindableValue(value)) {\n                            const initialValue = val(value)\n                            setElementAttribute(node, slot.name, initialValue)\n                            let currentValue = initialValue\n                            this.#bindings.push({\n                                canUpdate: (nextValues) =>\n                                    isRebindableValue(nextValues[valueIndex]),\n                                update: (nextValues) => {\n                                    const nextValue = val(nextValues[valueIndex])\n                                    if (Object.is(currentValue, nextValue)) {\n                                        return false\n                                    }\n                                    setElementAttribute(node, slot.name, nextValue)\n                                    currentValue = nextValue\n                                    return true\n                                },\n                            })\n                            continue\n                        }\n                    }\n\n                    for (const p of slot.valueParts) {\n                        let value = typeof p === 'number' ? this.#values[p] : p\n"""
          s = s.replace(attr_needle, attr_fast)

          content_needle = """                if (node) {\n                    nodes[slot.nodeId] = node\n                    const parentNode = node.parentNode as HTMLElement\n                    const cont = document.createDocumentFragment()\n\n                    for (const p of slot.valueParts) {\n"""
          content_fast = """                if (node) {\n                    nodes[slot.nodeId] = node\n                    const parentNode = node.parentNode as HTMLElement\n\n                    if (\n                        slot.valueParts.length === 1 &&\n                        typeof slot.valueParts[0] === 'number'\n                    ) {\n                        const valueIndex = slot.valueParts[0]\n                        const part = this.#values[valueIndex]\n                        if (typeof part !== 'function' && isRebindableValue(part)) {\n                            const textNode = document.createTextNode(String(part))\n                            node.parentNode?.replaceChild(textNode, node)\n                            let currentValue = part\n                            this.#bindings.push({\n                                canUpdate: (nextValues) =>\n                                    isRebindableValue(nextValues[valueIndex]),\n                                update: (nextValues) => {\n                                    const nextValue = nextValues[valueIndex]\n                                    if (Object.is(currentValue, nextValue)) {\n                                        return false\n                                    }\n                                    textNode.nodeValue = String(nextValue)\n                                    currentValue = nextValue\n                                    return true\n                                },\n                            })\n                            continue\n                        }\n                    }\n\n                    const cont = document.createDocumentFragment()\n\n                    for (const p of slot.valueParts) {\n"""
          s = s.replace(content_needle, content_fast)
          p.write_text(s)
          PY
          }

          apply_qsa_index /tmp/markup-qsa-index
          apply_primitive_fast /tmp/markup-primitive-fast
          apply_qsa_index /tmp/markup-combined
          apply_primitive_fast /tmp/markup-combined

          run_variant() {
            local name="$1"
            local dir="/tmp/markup-$name"
            echo "===== VARIANT: $name ====="
            cd "$dir"
            if [ "$name" != base ]; then ln -s /tmp/markup-base/node_modules node_modules; fi
            sed -i 's/const SIZES = \[20, 60, 250, 1000\]/const SIZES = [20, 250]/' benchmarks/repeat-cache.bench.ts
            sed -i 's/const SIZES = \[20, 60, 250, 1000\]/const SIZES = [20, 250]/' benchmarks/repeat-dom.bench.ts
            npx tsc --noEmit
            npm run benchmark:repeat
            npm run benchmark:dom
            cd "$ROOT"
          }

          run_variant base
          run_variant qsa-index
          run_variant primitive-fast
          run_variant combined

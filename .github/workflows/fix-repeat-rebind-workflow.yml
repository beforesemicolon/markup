name: Fix repeat rebind workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/reuse-keyed-repeat-templates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reuse-keyed-repeat-templates
      - name: Correct patch script
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-repeat-rebind.yml')
          text = path.read_text()
          text = text.replace('        if (updated) this.#updateSub?.(this)\\n', '')
          text = text.replace('        const first = read()\\n        const second = read()\\n', '        const first = read() as unknown[]\\n        const second = read() as unknown[]\\n')
          path.write_text(text)
          PY
          rm .github/workflows/fix-repeat-rebind-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-repeat-rebind.yml .github/workflows/fix-repeat-rebind-workflow.yml
          git commit -m "fix repeat rebind patch workflow"
          git push origin HEAD:agent/reuse-keyed-repeat-templates
